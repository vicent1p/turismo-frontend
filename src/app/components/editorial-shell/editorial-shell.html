<div class="historia-page-shell">
  <app-public-navbar [activeSection]="activeSection()"></app-public-navbar>

  <main class="historia-main">
    <div
      class="historia-sheet"
      [class.sheet-gallery]="sheetWidth() === 'gallery'"
      [class.sheet-wide]="sheetWidth() === 'wide'"
      [class.sheet-lugares]="activeSection() === 'lugares'"
    >
      @if (activeSection() === 'lugares') {
        <!-- CABECERA PERSONALIZADA LUGARES Y EXPERIENCIAS (RÉPLICA EXACTA DISEÑO OFICIAL PÁGINA 5) -->
        <header class="lugares-header-banner">
          <!-- ILUSTRACIONES ARTÍSTICAS DE FONDO -->
          <div class="lugares-banner-watermarks" aria-hidden="true">
            <img
              src="ilustracion-caiman-watermark.png"
              alt=""
              class="lugares-watermark-caiman"
              loading="eager"
            />
            <img
              src="ilustracion-iglesia-watermark.png"
              alt=""
              class="lugares-watermark-iglesia"
              loading="eager"
            />
          </div>

          <!-- CONTENIDO EDITORIAL CENTRADO -->
          <div class="lugares-banner-inner">
            <span class="lugares-banner-eyebrow">{{ eyebrow() }}</span>
            <div class="lugares-banner-gold-rule"></div>
            <h1 class="lugares-banner-title">{{ pageTitle() }}</h1>
            <div class="lugares-banner-gold-rule"></div>
            <p class="lugares-banner-subtitle">{{ subtitle() }}</p>
          </div>

          <!-- LÍNEA CURVA ONDULADA INFERIOR -->
          <div class="lugares-banner-wave-line" aria-hidden="true">
            <img
              src="lugares-wave-line.png"
              alt=""
              class="lugares-wave-img"
            />
          </div>
        </header>
      } @else {
        <!-- CABECERA EDITORIAL EN SPECTRAL TIPO LANDING PAGE -->
        <header class="historia-header">
          <span class="historia-eyebrow">{{ eyebrow() }}</span>
          <div class="historia-gold-rule"></div>
          <h1 class="historia-title">{{ pageTitle() }}</h1>
          <div class="historia-gold-rule"></div>
          <p class="historia-subtitle">{{ subtitle() }}</p>
        </header>
      }

      <!-- CONTENIDO PROPIO DEL APARTADO -->
      <ng-content></ng-content>

      <!-- BLOQUE FINAL DE CONTINUIDAD TIPO LANDING -->
      <footer class="historia-closing-cta">
        <span class="closing-tag">{{ closingTag() }}</span>
        <h2 class="closing-title">{{ closingTitle() }}</h2>
        <p class="closing-desc">{{ closingDesc() }}</p>
        <div class="closing-actions">
          <a [routerLink]="ctaPrimaryRoute()" [fragment]="ctaPrimaryFragment()" class="btn-hist-primary">
            <span>{{ ctaPrimaryLabel() }}</span>
            <span aria-hidden="true">→</span>
          </a>
          <a [routerLink]="ctaSecondaryRoute()" [fragment]="ctaSecondaryFragment()" class="btn-hist-secondary">
            <span>{{ ctaSecondaryLabel() }}</span>
          </a>
          <a routerLink="/" class="btn-hist-link">
            <span>← {{ ctaBackLabel() }}</span>
          </a>
        </div>
      </footer>
    </div>
  </main>

  <app-public-footer></app-public-footer>
</div>
