<!-- PIE DE PÁGINA INSTITUCIONAL (GOBERNACIÓN DEL MAGDALENA & ALCALDÍA DE PLATO) -->
<footer class="institutional-footer" id="contacto">
  <div class="footer-clean-wrap">
    <div class="footer-logos-row">
      <img
        src="escudo-gobernacion.png"
        [alt]="t().gobAlt"
        class="footer-escudo-img"
        loading="lazy"
      />
      <img
        src="escudo-alcaldia.png"
        [alt]="t().alcaldiaAlt"
        class="footer-escudo-img"
        loading="lazy"
      />
    </div>
    <div class="footer-gold-divider"></div>
    <p class="footer-copy">
      {{ t().copyText }}
    </p>
  </div>
</footer>
