<header class="top-header">
  <!-- FONDO ORGÁNICO CURVO DEL NAVBAR -->
  <div class="header-curved-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 76" preserveAspectRatio="none" class="header-curved-svg">
      <defs>
        <linearGradient id="navGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#124828" />
          <stop offset="18%" stop-color="#14552B" />
          <stop offset="50%" stop-color="#165D30" />
          <stop offset="78%" stop-color="#15582E" />
          <stop offset="100%" stop-color="#134C29" />
        </linearGradient>
        <clipPath id="navCurveClip">
          <path d="M 0 0 L 0 68 C 80 70, 220 76, 420 76 C 600 76, 780 65, 980 65 C 1120 65, 1280 72, 1440 72 L 1440 0 Z" />
        </clipPath>
      </defs>
      <!-- Base shape con gradiente verde institucional -->
      <path
        d="M 0 0 L 0 68 C 80 70, 220 76, 420 76 C 600 76, 780 65, 980 65 C 1120 65, 1280 72, 1440 72 L 1440 0 Z"
        fill="url(#navGreenGrad)"
      />
      <!-- Textura sutil recortada exactamente a la curva -->
      <image
        href="fondo-ilustracion-plato.jpg"
        x="0"
        y="0"
        width="1440"
        height="76"
        preserveAspectRatio="xMidYMid slice"
        opacity="0.14"
        clip-path="url(#navCurveClip)"
        style="filter: grayscale(1) contrast(1.1); mix-blend-mode: soft-light;"
      />
    </svg>
  </div>

  <div class="top-nav-container">
    <!-- LOGOS A LA IZQUIERDA: PLATO 400 AÑOS Y GOBERNACIÓN DEL MAGDALENA -->
    <div class="nav-brand-group">
      <a class="nav-brand" routerLink="/" (click)="onHomeAnchorClick($event, 'top')" [title]="t().brandTitle">
        <img src="logo-plato-white.png" [alt]="t().brandTitle" class="brand-logo-img" />
      </a>
      <a class="nav-brand nav-brand-gob" href="https://www.magdalena.gov.co" target="_blank" rel="noopener noreferrer" [title]="t().gobTitle">
        <img src="logo-gobernacion-magdalena-white.png" [alt]="t().gobTitle" class="brand-logo-img gob-logo-img" />
      </a>
    </div>

    <!-- ENLACES DE NAVEGACIÓN CENTRADOS (Y MENÚ DESPLEGABLE EN MÓVIL) -->
    <nav class="nav-links" [class.open]="mobileMenuOpen()" [attr.aria-label]="t().navAria">
      <a
        routerLink="/"
        (click)="onHomeAnchorClick($event, 'top'); closeMobileMenu()"
        class="nav-item"
        [class.active]="activeSection() === 'inicio'"
      >{{ t().navInicio }}</a>
      <a
        routerLink="/historia"
        (click)="closeMobileMenu()"
        class="nav-item"
        [class.active]="activeSection() === 'historia'"
      >{{ t().navHistoria }}</a>
      <a
        routerLink="/cultura"
        (click)="closeMobileMenu()"
        class="nav-item"
        [class.active]="activeSection() === 'cultura'"
      >{{ t().navCultura }}</a>
      <a
        routerLink="/"
        fragment="plato"
        (click)="onHomeAnchorClick($event, 'plato'); closeMobileMenu()"
        class="nav-item"
      >{{ t().navPueblo }}</a>
      <a
        routerLink="/programacion"
        (click)="closeMobileMenu()"
        class="nav-item"
        [class.active]="activeSection() === 'programacion'"
      >{{ t().navProgramacion }}</a>

      <!-- Versión móvil para Únete a la celebración -->
      <a
        routerLink="/programacion"
        (click)="closeMobileMenu()"
        class="nav-item mobile-celebracion-item"
        [class.active]="activeSection() === 'programacion'"
      >{{ t().btnCelebracion }}</a>
    </nav>

    <!-- ACCIONES A LA DERECHA -->
    <div class="nav-actions">
      <a
        routerLink="/programacion"
        class="btn-celebracion desktop-celebracion"
        [class.active]="activeSection() === 'programacion'"
      >{{ t().btnCelebracion }}</a>

      <div class="lang-selector" id="lang">
        <button type="button" [class.on]="lang() === 'es'" (click)="setLang('es')" aria-label="Cambiar a Español">ES</button>
        <button type="button" [class.on]="lang() === 'en'" (click)="setLang('en')" aria-label="Switch to English">EN</button>
      </div>

      <!-- BOTÓN HAMBURGUESA / MENÚ MÓVIL -->
      <button
        type="button"
        class="btn-menu-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        [attr.aria-label]="t().navAria"
      >
        @if (!mobileMenuOpen()) {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>

      @if (authService.isAuthenticated()) {
        <div class="user-session-pill">
          <span class="user-badge">
            <span class="user-dot"></span> {{ roleLabel() || t().adminActivo }}
          </span>
          <a class="btn btn-panel-link" routerLink="/panel">
            🏛 {{ t().miEspacio }}
          </a>
          <button type="button" class="btn btn-logout" (click)="logout()">
            {{ t().logoutBtn }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
